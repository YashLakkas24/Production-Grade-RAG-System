services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_python
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: